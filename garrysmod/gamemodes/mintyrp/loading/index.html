<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>MintyRP — Loading</title>
	<link rel="stylesheet" href="css/loading.css" />
</head>
<body>
	<div class="bg" aria-hidden="true"></div>
	<div class="vignette" aria-hidden="true"></div>

	<main class="panel">
		<img class="logo" src="assets/logo.png" alt="MintyRP" />
		<p class="tagline">Serious roleplay · Rockford</p>

		<div class="meta">
			<div class="meta-row">
				<span class="label">Server</span>
				<span id="server-name">MintyRP</span>
			</div>
			<div class="meta-row">
				<span class="label">Map</span>
				<span id="map-name">rp_rockford_v2b</span>
			</div>
			<div class="meta-row">
				<span class="label">Gamemode</span>
				<span id="gamemode-name">MintyRP</span>
			</div>
		</div>

		<div class="progress-wrap">
			<div class="progress-bar" id="progress-bar"></div>
		</div>
		<p class="status" id="status-text">Connecting…</p>

		<ul class="rules">
			<li>Stay in character in public</li>
			<li>Value your life — no RDM / RDA</li>
			<li>Listen to staff &amp; report with evidence</li>
		</ul>
	</main>

	<script src="js/loading.js"></script>
</body>
</html>
